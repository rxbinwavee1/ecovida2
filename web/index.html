<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Econex Planer</title>

  <!-- PWA & Apple iOS Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Econex Planer">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">

    <!-- Top Header -->
    <header class="top-header">
      <h1>Econex Planer</h1>
      <div class="header-actions">
        <button id="notif-btn" class="icon-btn" onclick="requestNotificationPermission()" title="Erinnerungen aktivieren">🔔</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Design umschalten">
          <span id="theme-icon">☀️</span>
        </button>
        <button class="icon-btn danger" onclick="purgeAll()" title="Alle löschen">🗑️</button>
        <button class="icon-btn" onclick="renderApp()" title="Aktualisieren">🔄</button>
      </div>
    </header>

    <!-- Top Action Buttons Row -->
    <div class="action-buttons-row">
      <button class="btn-action btn-primary" onclick="document.getElementById('file-screenshot').click()">
        ✨ Screenshot
      </button>
      <input type="file" id="file-screenshot" accept="image/*" style="display: none;" onchange="alert('Screenshot verarbeitet!')">

      <button class="btn-action btn-secondary" onclick="document.getElementById('file-csv').click()">
        📊 CSV
      </button>
      <input type="file" id="file-csv" accept=".csv, .txt" style="display: none;" onchange="handleCsvUpload(this.files[0])">

      <button class="btn-action btn-outlined" onclick="document.getElementById('manual-modal').style.display='flex'">
        ➕ Manuell
      </button>
    </div>

    <!-- Stats Card -->
    <div class="stats-card">
      <div class="stat-item">
        <div class="stat-icon">💶</div>
        <div class="stat-info">
          <div class="label">Gesamthonorar</div>
          <div class="value" id="total-earnings">0,00 €</div>
        </div>
      </div>
      <div class="stat-item">
        <div class="stat-icon">🚆</div>
        <div class="stat-info">
          <div class="label">Aktive Einsätze</div>
          <div class="value" id="active-count">0</div>
        </div>
      </div>
    </div>

    <!-- Active vs Archiv Tabs -->
    <div class="tabs-row">
      <button id="tab-aktiv" class="tab-btn active" onclick="setTab('AKTIV')">
        📋 <span id="tab-aktiv-label">Aktive Einsätze (0)</span>
      </button>
      <button id="tab-archiv" class="tab-btn" onclick="setTab('ARCHIV')">
        📥 <span id="tab-archiv-label">Archiv (0)</span>
      </button>
    </div>

    <!-- Filter Chips Scroll -->
    <div class="chips-scroll">
      <button class="chip active" onclick="setStatusFilter(null)">Alle</button>
      <button class="chip" onclick="setStatusFilter('OFFEN')">Offen</button>
      <button class="chip" onclick="setStatusFilter('VERSCHOBEN')">Verschoben</button>
      <button class="chip" onclick="setStatusFilter('ABGEBROCHEN')">Abgebrochen</button>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" placeholder="Einsatz, Bahnhof, Linie" oninput="onSearchInput(this.value)">
    </div>

    <!-- Shifts Container -->
    <main id="shifts-list" class="shifts-list">
      <!-- Items dynamically populated -->
    </main>

  </div>

  <!-- Manual Entry Modal -->
  <div id="manual-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Neuen Einsatz eintragen</h3>
      <input type="text" id="m-datum" placeholder="Datum (z. B. Di, 10.11.2026)">
      <div style="display: flex; gap: 8px;">
        <input type="text" id="m-abzeit" placeholder="Ab-Zeit (z. B. 21:13)">
        <input type="text" id="m-anzeit" placeholder="An-Zeit (z. B. 22:00)">
      </div>
      <input type="text" id="m-abbhf" placeholder="Abfahrts-Bahnhof">
      <input type="text" id="m-anbhf" placeholder="Ankunfts-Bahnhof">
      <div style="display: flex; gap: 8px;">
        <input type="text" id="m-tour" placeholder="Tour-Nr">
        <input type="text" id="m-linie" placeholder="Linie (z. B. SB3)">
      </div>
      <input type="text" id="m-honorar" placeholder="Honorar (€ z. B. 20,54)">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
        <button class="btn-action btn-outlined" onclick="closeModal('manual-modal')">Abbrechen</button>
        <button class="btn-action btn-primary" onclick="saveManualEntry()">Hinzufügen</button>
      </div>
    </div>
  </div>

  <!-- Reschedule Modal -->
  <div id="reschedule-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Einsatz verschieben</h3>
      <p style="font-size: 0.85rem; color: var(--text-sub);">Neues Datum eingeben:</p>
      <input type="text" id="reschedule-date-input" placeholder="z. B. Fr, 20.11.2026">
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn-action btn-outlined" onclick="closeModal('reschedule-modal')">Abbrechen</button>
        <button class="btn-action btn-primary" onclick="saveReschedule()">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Purge Confirmation Modal -->
  <div id="purge-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Alle Einsätze löschen?</h3>
      <p style="font-size: 0.85rem; color: var(--text-sub);">Möchtest du wirklich ALLE Einsätze unwiderruflich löschen?</p>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn-action btn-outlined" onclick="closeModal('purge-modal')">Abbrechen</button>
        <button class="btn-action" style="background-color: var(--error); color: white;" onclick="confirmPurgeAll()">Ja, alle löschen</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
